version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: bp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: 2356
      POSTGRES_DB: saas-boilerplate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bp-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3002:3002'
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://boilerplate:2356@postgres:5432/saas-boilerplate
      REDIS_HOST: redis
      REDIS_PORT: 6379

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: bp-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002

  staff:
    build:
      context: .
      dockerfile: Dockerfile.staff
    container_name: bp-staff
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3001:3001'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002

volumes:
  postgres_data:
    driver: local
