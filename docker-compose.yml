
services:
  kong-db:
    image: postgres:15
    container_name: kong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - '5433:5432'
    volumes:
      - kong-db-data:/var/lib/postgresql/data

  kong-migrations:
    image: kong:3.6
    container_name: kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: kong
      KONG_PASSWORD: kong
    depends_on:
      - kong-db

  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - '8000:8000'   # Proxy (API Gateway)
      - '8443:8443'   # Proxy SSL
      - '8001:8001'   # Admin API
      - '8444:8444'   # Admin API SSL
    depends_on:
      - kong-db
      - kong-migrations

  postgres:
    image: postgres:17
    container_name: bp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: 2356
      POSTGRES_DB: saas-boilerplate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bp-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3002:3002'
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://boilerplate:2356@postgres:5432/saas-boilerplate
      REDIS_HOST: redis
      REDIS_PORT: 6379

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: bp-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002

  staff:
    build:
      context: .
      dockerfile: Dockerfile.staff
    container_name: bp-staff
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3001:3001'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002

volumes:
  postgres_data:
    driver: local
  kong-db-data:
    driver: local
